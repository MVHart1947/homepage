---
layout: default
title: Historie
header: Historie
---
{% assign vereinsgeschichte = site.data.historie | first %}
<div class="card mb-2">
    <div class="card-body">
        <h3 class="card-title"><i class="fa-solid {{ vereinsgeschichte.icon }}"></i> {{ vereinsgeschichte.titel }}</h3>
        <hr>
        {{ vereinsgeschichte.inhalt }}
    </div>
</div>
<hr>
<div class="row row-cols-1 row-cols-md-2 g-2">
    {% for abschnitt in site.data.historie offset:1 %}
    <div class="col">
        <div class="card h-100">
            <div class="card-body">
                <h3 class="card-title"><i class="fa-solid {{ abschnitt.icon }}"></i> {{ abschnitt.titel }}</h3>
                <hr>
                {{ abschnitt.inhalt }}
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Footer -->
<div class="container-fluid" id="footer">
    <div class="row gy-3 align-items-center align-items-md-end">
        <div class="col-12 col-md-4 text-center text-md-start">
            <nav class="nav flex-column align-items-center align-items-md-start nav-underline">
                {% for item in site.data.rechtliches %}<a class="nav-link link-secondary {% if page.url == item.url %}active{% endif %}" aria-current="{% if page.url == item.url %}page{% endif %}" href="{{ item.url | relative_url }}">{{ item.titel }}</a>
                {% endfor %}</nav>
        </div>
        <div class="col-12 col-md-4 text-center">
            <a href="/">
                <img src="/assets/media/mv-logo.svg" alt="MV-Logo" width="140" loading="lazy" decoding="async">
            </a>
        </div>
        <div class="col-12 col-md-4 text-center text-md-end">
            <small class="text-body-secondary">&copy; {{ site.time | date: "%Y" }} {{ site.contact.organisation }}</small>
        </div>
    </div>
</div>
<!-- Footer End -->

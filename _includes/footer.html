<!-- Footer -->
<div class="container-fluid" id="footer">
    <div class="text-center">
        <h6 class="text-body-secondary mb-2">Social Media</h6>
        <div class="footer-social mx-auto mb-3">
            <div class="row">
                <div class="col">
                    <a href="https://www.facebook.com/people/Musikverein-Hart-eV/100066495306368/" class="fa-btn fa-brands fa-facebook" target="_blank" rel="noopener noreferrer"></a>
                </div>
                <div class="col">
                    <a href="https://www.instagram.com/musikverein_hart/" class="fa-btn fa-brands fa-instagram" target="_blank" rel="noopener noreferrer"></a>
                </div>
            </div>
        </div>
        <a href="/">
            <img src="/assets/media/mv-logo.svg" alt="MV-Logo" width="170" loading="lazy" decoding="async">
        </a>
        <nav class="footer-nav mt-3">
            {% for item in site.data.rechtliches %}<a class="footer-link {% if page.url == item.url %}active{% endif %}" aria-current="{% if page.url == item.url %}page{% endif %}" href="{{ item.url | relative_url }}">{{ item.titel }}</a>{% unless forloop.last %}<span class="footer-link-sep">&middot;</span>{% endunless %}
            {% endfor %}
        </nav>
        <p class="footer-copyright mt-3 mb-0">&copy; {{ site.time | date: "%Y" }} {{ site.contact.organisation }}</p>
    </div>
</div>
<!-- Footer End -->

<!-- Footer -->
<div id="footer">
    <div class="container">
        <div class="row align-items-start gy-4">
            <div class="col-12 col-md-auto order-1 text-center text-md-start">
                <h5 class="text-body-secondary mb-2">Social Media</h5>
                <div class="footer-social">
                    <a href="https://www.facebook.com/people/Musikverein-Hart-eV/100066495306368/" class="footer-social-link" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                    <a href="https://www.instagram.com/musikverein_hart/" class="footer-social-link" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
            <div class="col-12 col-md order-3 order-md-2 text-center">
                <a href="/">
                    <img src="/assets/media/mv-logo.svg" alt="MV-Logo" width="170" loading="lazy" decoding="async">
                </a>
                <p class="footer-copyright mt-3 mb-0">&copy; {{ site.time | date: "%Y" }} {{ site.contact.organisation }}</p>
            </div>
            <div class="col-12 col-md-auto order-2 order-md-3 text-center text-md-end">
                <nav class="footer-nav">
                    {% for item in site.data.rechtliches %}<a class="footer-link {% if page.url == item.url %}active{% endif %}" aria-current="{% if page.url == item.url %}page{% endif %}" href="{{ item.url | relative_url }}">{{ item.titel }}</a>{% unless forloop.last %}<span class="footer-link-sep">&middot;</span>{% endunless %}
                    {% endfor %}
                </nav>
            </div>
        </div>
    </div>
</div>
<!-- Footer End -->

<div class="item" id="{{ include.gruppe.instrument | slugify }}">
  <div class="card">
    <div class="card-header text-center">
      <h5 class="card-title mb-0">{{ include.gruppe.instrument }}</h5>
    </div>
    <img src="{{ include.gruppe.bild }}" class="card-img-top" loading="lazy" decoding="async" width="{{ include.gruppe.breite }}" height="{{ include.gruppe.hoehe }}">
    <div class="card-body">
      <ul class="list-group list-group-flush">
        {% assign mitglieder = site.data.mitglieder | where: "register", include.gruppe.instrument %}
        {% for person in mitglieder %}<li class="list-group-item">{{ person.name }}</li>
        {% endfor %}</ul>
    </div>
  </div>
</div>

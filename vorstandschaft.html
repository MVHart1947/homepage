---
layout: default
title: Die Vorstandschaft
header: Die Vorstandschaft
---
<div class="card px-0">
    <div class="row g-0">
        <div class="col-lg-8">
            <img class="img-fluid rounded-start" src="assets/media/register/04_Vorstandschaft 3.webp" loading="lazy" decoding="async" width="1047" height="753">
        </div>
        <div class="col-lg-4">
            <div class="card-body">
                {% for eintrag in site.data.vorstandschaft %}<h6 class="card-subtitle mb-2 text-body-secondary">{{ eintrag.rolle }}</h6>
                <p class="card-text">{{ eintrag.personen | join: eintrag.trennzeichen }}</p>
                {% unless forloop.last %}<hr>
                {% endunless %}{% endfor %}
            </div>
        </div>
    </div>
</div>

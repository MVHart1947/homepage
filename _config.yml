url: "https://www.musikverein-hart.de" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog
title: "Musikverein Hart e.V." # the name of your site, e.g. ACME Corp.
description: "Website des Musikverein Hart e.V."

# ----------------------------------------------------------------
# Vereinskontakt (u.a. im Impressum genutzt)
# ----------------------------------------------------------------
contact:
  organisation: "Musikverein Hart e.V."
  address_line1: "Tannwaldstraße 16"
  address_line2: "72401 Haigerloch"
  email: "info@musikverein-hart.de"
  # Vorstandsnamen kommen aus _data/vorstandschaft.yml (siehe impressum.html)

# ----------------------------------------------------------------
# Social-Media-Links (u.a. im Footer genutzt, siehe _includes/footer.html)
# ----------------------------------------------------------------
social:
  facebook: "https://www.facebook.com/people/Musikverein-Hart-eV/100066495306368/"
  instagram: "https://www.instagram.com/musikverein_hart/"
  github: "https://github.com/MVHart1947/musikverein-hart.de"

# ----------------------------------------------------------------
# Sass / Bootstrap
# ----------------------------------------------------------------
sass:
  style: compressed
  load_paths:
    - _sass
  # Unterdrückt Deprecation-Warnungen aus Abhängigkeiten (z.B. der
  # Bootstrap-Gem) – Warnungen aus eigenem _sass/-Code werden weiterhin
  # angezeigt.
  quiet_deps: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - script

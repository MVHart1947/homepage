# - mitglieder.html (via _includes/register-card.html) gruppiert nach
#   "register" (Metadaten wie Foto/Größe je Register in _data/register.yml).
# - vorstandschaft.html, kontakt.html, impressum.html und jugend.html
#   filtern nach "rollen" (Rollen-Metadaten wie Anzeigetext/E-Mail in
